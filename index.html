<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MR.stevebean'灯塔</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
    <style>
        :root{
            --bg:#f7f8fa;
            --card:#fff;
            --text:#333;
            --accent:#0077ff;
            --shadow:rgba(0,0,0,.05);
        }
        [data-theme="dark"]{
            --bg:#0d1117;
            --card:#161b22;
            --text:#c9d1d9;
            --accent:#58a6ff;
            --shadow:rgba(0,0,0,.3);
        }
        
        body{
            margin:0;
            font-family:Inter,Helvetica,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
            transition:background .3s,color .3s;
        }
        header{
            padding:60px 20px 40px;
            text-align:left; /* 关键修改：靠左对齐 */
            position:relative;
        }
        h1{font-size:2.2rem;margin:0 0 20px} /* 增加标题与搜索框间距 */
        
        /* 深色模式切换按钮 */
        #themeToggle{
            position:absolute;
            top:20px;
            right:20px;
            background:none;
            border:none;
            font-size:1.5rem;
            color:var(--accent);
            cursor:pointer;
            transition:.3s;
        }
        
        #searchBox{
            max-width:400px;width:90%;padding:12px 16px;
            border:1px solid #444;border-radius:4px; /* 改为方角 */
            font-size:1rem;outline:none;transition:.3s;
            background:var(--card);color:var(--text);
        }
        #searchBox:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,.2)}
        
        main{max-width:1000px;margin:0 auto;padding:0 20px 60px}
        .group{margin-bottom:40px}
        .group h2{font-size:1.3rem;margin:0 0 15px;display:flex;align-items:center}
        .group h2 i{margin-right:8px;color:var(--accent)}
        .cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
        .card{
            background:var(--card);border-radius:12px;padding:18px 12px;
            text-align:center;box-shadow:0 2px 6px var(--shadow);
            transition:.2s;text-decoration:none;color:inherit
        }
        .card:hover{transform:translateY(-3px);box-shadow:0 4px 12px var(--shadow)}
        .card i{font-size:1.8rem;margin-bottom:8px;color:var(--accent)}
        .card span{display:block;font-size:.9rem}
        
        @media(max-width:600px){
            .cards{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
            header{padding:40px 16px 30px} /* 移动端减小header内边距 */
        }
    </style>
</head>
<body>
<header>
    <button id="themeToggle" title="切换深色/浅色模式">
        <i class="fas fa-moon"></i>
    </button>
    <h1>MR.SteveBean's便签</h1>
    <input id="searchBox" type="text" placeholder="搜索站点 …" onkeyup="filterCards()">
</header>

<main>
    <section class="group">
        <h2><i class="fas fa-toolbox"></i>常用工具</h2>
        <div class="cards">
            <a class="card" href="https://github.com" target="_blank">
                <i class="fab fa-github"></i><span>GitHub</span>
            </a>
            <a class="card" href="https://www.figma.com" target="_blank">
                <i class="fab fa-figma"></i><span>Figma</span>
            </a>
            <a class="card" href="https://translate.google.com" target="_blank">
                <i class="fas fa-language"></i><span>翻译</span>
            </a>
        </div>
    </section>

    <section class="group">
        <h2><i class="fas fa-graduation-cap"></i>资源</h2>
        <div class="cards">
            
            </a>
        </div>
    </section>
</main>

<script>
// 深色模式控制
const toggleBtn = document.getElementById('themeToggle');
const icon = toggleBtn.querySelector('i');

if(localStorage.getItem('theme') === 'dark' || 
  (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)){
    document.documentElement.setAttribute('data-theme', 'dark');
    icon.className = 'fas fa-sun';
}

toggleBtn.onclick = () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
};

// 搜索功能
function filterCards(){
    const val = document.getElementById('searchBox').value.toLowerCase();
    document.querySelectorAll('.card').forEach(card=>{
        const txt = card.querySelector('span').textContent.toLowerCase();
        card.style.display = txt.includes(val) ? '' : 'none';
    });
}
</script>
</body>
</html>
