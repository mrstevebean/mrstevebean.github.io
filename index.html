<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MR.SteveBean's 灯塔导航</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css">
    <style>
        :root{
            --bg:#f5f7fa;
            --card:#fff;
            --text:#2c3e50;
            --accent:#3498db;
            --shadow:0 4px 15px rgba(0,0,0,.08);
            --gradient:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        [data-theme="dark"]{
            --bg:#1a1a2e;
            --card:#16213e;
            --text:#eee;
            --accent:#00d2ff;
            --shadow:0 4px 15px rgba(0,0,0,.3);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:Inter,Helvetica,Arial,sans-serif;
            background:var(--bg);
            color:var(--text);
            transition:.3s;
            min-height:100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120,119,198,.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,119,198,.1) 0%, transparent 50%);
        }
        header{
            padding:60px 40px 40px;
            background:var(--gradient);
            color:#fff;
            text-align:center;
        }
        h1{font-size:2.5rem;margin-bottom:10px}
        .subtitle{font-size:1.1rem;opacity:.9}
        main{max-width:400px;margin:60px auto;padding:0 20px}
        .site-card{
            background:var(--card);
            border-radius:20px;
            padding:30px;
            box-shadow:var(--shadow);
            text-align:center;
            transition:.3s;
        }
        .site-card:hover{transform:translateY(-5px)}
        .site-icon{
            width:60px;height:60px;
            margin:0 auto 15px;
            border-radius:12px;
            background:#4285f4;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;color:#fff;
        }
        .site-title{font-size:1.3rem;font-weight:600;margin-bottom:10px}
        .site-desc{color:#666;font-size:.95rem;margin-bottom:20px;line-height:1.4}
        .action-btn{
            padding:10px 25px;
            border:none;
            border-radius:25px;
            font-size:1rem;
            cursor:pointer;
            background:var(--gradient);
            color:#fff;
            text-decoration:none;
            display:inline-block;
        }
        footer{
            text-align:center;
            padding:40px;
            color:#666;
        }
        #themeToggle{
            position:fixed;
            top:20px;
            right:20px;
            width:40px;height:40px;
            border:none;
            border-radius:50%;
            background:rgba(255,255,255,.2);
            color:#fff;
            cursor:pointer;
            font-size:1.1rem;
            backdrop-filter:blur(5px);
            z-index:10;
        }
    </style>
</head>
<body>
    <button id="themeToggle" title="切换深色/浅色模式">
        <i class="fas fa-moon"></i>
    </button>

    <header>
        <h1>MR.SteveBean's 灯塔</h1>
        <p class="subtitle">被世界遗忘之人的数字港湾</p>
    </header>

    <main>
        <div class="site-card">
            <div class="site-icon">
                <i class="fas fa-language"></i>
            </div>
            <div class="site-title">Google 翻译</div>
            <div class="site-desc">强大、免费、即时的在线翻译服务</div>
            <a href="https://translate.google.com" target="_blank" class="action-btn">立即使用</a>
        </div>
    </main>

    <footer>
        <p>Copyright © 2025-2121</p>
    </footer>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const icon = toggleBtn.querySelector('i');
        toggleBtn.onclick = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        };
    </script>
</body>
</html>
